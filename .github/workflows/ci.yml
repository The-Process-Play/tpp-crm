name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, SQLite + Postgres)
    runs-on: ubuntu-latest
    # Run inside the official Python images rather than using setup-python: GitHub's newer Ubuntu
    # runners no longer ship Python 3.9, but we still need it (it's the macOS system Python used locally).
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]   # 3.9 = macOS system Python (local use), 3.12 = the Azure container
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: python --version && pip install --no-cache-dir -r requirements.txt
      - name: Run tests
        env:
          # Inside a container job, the Postgres service is reached by its name, not localhost
          TEST_DATABASE_URL: postgresql://crm:crm@postgres:5432/crm_test
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  container:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tpp-crm:ci .
